<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BB TEKNOLOJİ PRO - Kurumsal ERP & Kasa Platformu</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0d14;
            --card-bg: #111622;
            --card-inner: #161c2d;
            --input-bg: #1c2338;
            --gold-bright: #fbbf24;
            --gold-main: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(245, 158, 11, 0.3);
            --danger: #ef4444;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 20px; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 20px 25px; border-radius: 16px; border: 1px solid var(--border-color); margin-bottom: 25px; }
        h1 { font-size: 24px; font-weight: 800; color: var(--gold-bright); letter-spacing: 0.5px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--border-color); }
        .stat-title { font-size: 13px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
        .stat-value { font-size: 24px; font-weight: 700; color: var(--gold-bright); }
        .menu-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
        .menu-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .menu-btn.active { background: var(--gold-main); color: #000; border-color: var(--gold-bright); }
        .section-box { background: var(--card-bg); padding: 25px; border-radius: 16px; border: 1px solid var(--border-color); display: none; }
        .section-box.active { display: block; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
        .form-group input { width: 100%; background: var(--input-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 10px; color: #fff; font-size: 14px; }
        .btn-save { background: var(--gold-main); color: #000; border: none; padding: 14px 25px; border-radius: 12px; font-weight: 700; cursor: pointer; width: 100%; font-size: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { color: var(--text-muted); font-weight: 600; }
        .btn-delete { background: var(--danger); color: #fff; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>BB TEKNOLOJİ PRO</h1>
        <div style="color: var(--success); font-weight: 600; font-size: 14px;">● CANLI BULUT SİSTEMİ</div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-title">TOPLAM ÇEŞİT / STOK</div>
            <div class="stat-value" id="toplamStok">0 Çeşit / 0 Adet</div>
        </div>
        <div class="stat-card">
            <div class="stat-title">KAYITLI BAYİ SAYISI</div>
            <div class="stat-value" id="toplamBayi">0 Bayi</div>
        </div>
    </div>

    <div class="menu-grid">
        <button class="menu-btn active" onclick="tabDegistir(0, this)">1. Stok</button>
        <button class="menu-btn" onclick="tabDegistir(1, this)">4. Bayi Ekstresi</button>
    </div>

    <!-- STOK SEKMESİ -->
    <div class="section-box active" id="tab-0">
        <h3 style="margin-bottom: 15px; color: var(--gold-bright);">Yeni Ürün / Stok Kaydı</h3>
        <div class="form-grid">
            <div class="form-group"><label>Barkod</label><input type="text" id="stokBarkod"></div>
            <div class="form-group"><label>Ürün Adı</label><input type="text" id="stokAd"></div>
            <div class="form-group"><label>Model / Renk</label><input type="text" id="stokModel"></div>
            <div class="form-group"><label>Alış Fiyatı (₺)</label><input type="number" id="stokAlis"></div>
            <div class="form-group"><label>Satış Fiyatı (₺)</label><input type="number" id="stokSatis"></div>
            <div class="form-group"><label>Stok Adedi</label><input type="number" id="stokAdet" value="1"></div>
        </div>
        <button class="btn-save" onclick="stokEkle()">STOK KAYDET</button>

        <table style="margin-top: 25px;">
            <thead>
                <tr><th>Ürün Adı</th><th>Model</th><th>Adet</th><th>Satış Fiyatı</th><th>İşlem</th></tr>
            </thead>
            <tbody id="stokTablosu"></tbody>
        </table>
    </div>

    <!-- BAYİ SEKMESİ -->
    <div class="section-box" id="tab-1">
        <h3 style="margin-bottom: 15px; color: var(--gold-bright);">Yeni Bayi Kaydı</h3>
        <div class="form-grid">
            <div class="form-group"><label>Bayi Adı / Firma</label><input type="text" id="bayiAdi"></div>
            <div class="form-group"><label>Yetkili Kişi</label><input type="text" id="bayiYetkili"></div>
            <div class="form-group"><label>Telefon</label><input type="text" id="bayiTel"></div>
        </div>
        <button class="btn-save" onclick="bayiEkle()">BAYİ KAYDET</button>

        <table style="margin-top: 25px;">
            <thead>
                <tr><th>Bayi Adı</th><th>Yetkili</th><th>Telefon</th><th>İşlem</th></tr>
            </thead>
            <tbody id="bayiTablosu"></tbody>
        </table>
    </div>
</div>

<script>
    let stoklar = JSON.parse(localStorage.getItem('bb_stoklar')) || [];
    let bayiler = JSON.parse(localStorage.getItem('bb_bayiler')) || [];

    function tabDegistir(index, el) {
        document.querySelectorAll('.section-box').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + index).classList.add('active');
        el.classList.add('active');
    }

    function stokEkle() {
        let yeniStok = {
            id: Date.now(),
            barkod: document.getElementById('stokBarkod').value,
            ad: document.getElementById('stokAd').value,
            model: document.getElementById('stokModel').value,
            alis: document.getElementById('stokAlis').value,
            satis: document.getElementById('stokSatis').value,
            adet: parseInt(document.getElementById('stokAdet').value) || 1
        };
        if(!yeniStok.ad) { alert('Ürün adı boş olamaz!'); return; }
        stoklar.push(yeniStok);
        localStorage.setItem('bb_stoklar', JSON.stringify(stoklar));
        verileriYenile();
        temizleStokForm();
    }

    function stokSil(id) {
        stoklar = stoklar.filter(s => s.id !== id);
        localStorage.setItem('bb_stoklar', JSON.stringify(stoklar));
        verileriYenile();
    }

    function bayiEkle() {
        let yeniBayi = {
            id: Date.now(),
            adi: document.getElementById('bayiAdi').value,
            yetkili: document.getElementById('bayiYetkili').value,
            tel: document.getElementById('bayiTel').value
        };
        if(!yeniBayi.adi) { alert('Bayi adı boş olamaz!'); return; }
        bayiler.push(yeniBayi);
        localStorage.setItem('bb_bayiler', JSON.stringify(bayiler));
        verileriYenile();
        temizleBayiForm();
    }

    function bayiSil(id) {
        bayiler = bayiler.filter(b => b.id !== id);
        localStorage.setItem('bb_bayiler', JSON.stringify(bayiler));
        verileriYenile();
    }

    function verileriYenile() {
        let toplamAdet = stoklar.reduce((toplam, s) => toplam + s.adet, 0);
        document.getElementById('toplamStok').innerText = `${stoklar.length} Çeşit / ${toplamAdet} Adet`;
        document.getElementById('toplamBayi').innerText = `${bayiler.length} Bayi`;

        let stokHtml = '';
        stoklar.forEach(s => {
            stokHtml += `<tr><td>${s.ad}</td><td>${s.model}</td><td>${s.adet}</td><td>${s.satis} ₺</td><td><button class="btn-delete" onclick="stokSil(${s.id})">Sil</button></td></tr>`;
        });
        document.getElementById('stokTablosu').innerHTML = stokHtml;

        let bayiHtml = '';
        bayiler.forEach(b => {
            bayiHtml += `<tr><td>${b.adi}</td><td>${b.yetkili}</td><td>${b.tel}</td><td><button class="btn-delete" onclick="bayiSil(${b.id})">Sil</button></td></tr>`;
        });
        document.getElementById('bayiTablosu').innerHTML = bayiHtml;
    }

    function temizleStokForm() {
        document.getElementById('stokBarkod').value = '';
        document.getElementById('stokAd').value = '';
        document.getElementById('stokModel').value = '';
        document.getElementById('stokAlis').value = '';
        document.getElementById('stokSatis').value = '';
        document.getElementById('stokAdet').value = '1';
    }

    function temizleBayiForm() {
        document.getElementById('bayiAdi').value = '';
        document.getElementById('bayiYetkili').value = '';
        document.getElementById('bayiTel').value = '';
    }

    verileriYenile();
</script>
</body>
</html>
